<!DOCTYPE html>
<html>
<head>
  <title>ColorSnatch</title>
  <style>
    body {
      width: 260px;
      padding: 15px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      color: #333;
    }
    h1 {
      font-size: 18px;
      margin-top: 0;
      margin-bottom: 15px;
      color: #3b82f6;
    }
    p {
      margin: 8px 0;
      line-height: 1.4;
    }
    .shortcut {
      background-color: #f1f5f9;
      padding: 2px 5px;
      border-radius: 3px;
      font-family: monospace;
      font-weight: bold;
    }
    .footer {
      margin-top: 15px;
      font-size: 12px;
      color: #64748b;
      border-top: 1px solid #e2e8f0;
      padding-top: 10px;
    }
  </style>
</head>
<body>
  <h1>🎨 ColorSnatch</h1>
  <p>Click the extension icon to activate color snatch mode.</p>
  <p>Your cursor will change to a crosshair. Click on any element to copy its background color or gradient to your clipboard.</p>
  <p>Press <span class="shortcut">ESC</span> to cancel selection.</p>
  <div class="footer">
    v1.0 - ColorSnatch
  </div>
</body>
</html>
